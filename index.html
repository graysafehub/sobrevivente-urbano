<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>GraySafe Hub</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">GraySafe Hub</span>
    <span class="offline" id="netStatus" hidden>offline</span>
    <span class="clock" id="clock"></span>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="Navegação">
    <a href="#painel" data-route="painel"><span class="ico" aria-hidden="true">◎</span>Hub</a>
    <a href="#estoque" data-route="estoque"><span class="ico" aria-hidden="true">▤</span>Estoque</a>
    <a href="#entrada" data-route="entrada" class="primary"><span class="ico" aria-hidden="true">+</span>Entrada</a>
    <a href="#compras" data-route="compras"><span class="ico" aria-hidden="true">☐</span>Compras</a>
    <a href="#familia" data-route="familia"><span class="ico" aria-hidden="true">♥</span>Família</a>
    <a href="#mais" data-route="mais"><span class="ico" aria-hidden="true">≡</span>Sistema</a>
  </nav>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="seed.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
